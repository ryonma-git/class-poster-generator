name: Build App (Mac + Windows)

# stable ブランチへの push、または手動実行でビルドが走る
on:
  push:
    branches: [stable]
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════
  #  macOS → .app ビルド
  # ══════════════════════════════════════════
  build-macos:
    runs-on: macos-13          # Intel Mac → Rosetta2でM1/M2でも動く
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリのインストール
        run: |
          pip install \
            Pillow opencv-python numpy pandas openpyxl \
            reportlab "pillow-heif" "xlrd==1.2.0" customtkinter \
            pyinstaller

      - name: make_poster をビルド（サブプロセス用）
        run: |
          pyinstaller \
            --onefile \
            --name make_poster \
            --hidden-import cv2 \
            --hidden-import pillow_heif \
            --hidden-import pandas \
            --hidden-import openpyxl \
            --hidden-import xlrd \
            make_poster.py

      - name: crop_adjuster をビルド（メインアプリ）
        run: |
          pyinstaller \
            --windowed \
            --name "CropAdjuster" \
            --collect-all customtkinter \
            --hidden-import PIL._tkinter_finder \
            --hidden-import cv2 \
            --hidden-import pillow_heif \
            --hidden-import pandas \
            --hidden-import openpyxl \
            --hidden-import xlrd \
            crop_adjuster.py

      - name: make_poster を .app に同梱
        run: |
          # .app の実行ファイル置き場に make_poster を入れる
          cp dist/make_poster "dist/CropAdjuster.app/Contents/MacOS/make_poster"

      - name: .app を zip にまとめる
        run: |
          cd dist
          zip -r "クロップ調整ツール-Mac.zip" "CropAdjuster.app"

      - name: アーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist/クロップ調整ツール-Mac.zip

  # ══════════════════════════════════════════
  #  Windows → .exe ビルド
  # ══════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリのインストール
        run: |
          pip install `
            Pillow opencv-python numpy pandas openpyxl `
            reportlab pillow-heif "xlrd==1.2.0" customtkinter `
            pyinstaller

      - name: make_poster をビルド（サブプロセス用）
        run: |
          pyinstaller `
            --onefile `
            --name make_poster `
            --hidden-import cv2 `
            --hidden-import pillow_heif `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            make_poster.py

      - name: crop_adjuster をビルド（メインアプリ）
        run: |
          pyinstaller `
            --windowed `
            --name CropAdjuster `
            --collect-all customtkinter `
            --hidden-import PIL._tkinter_finder `
            --hidden-import cv2 `
            --hidden-import pillow_heif `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            crop_adjuster.py

      - name: make_poster.exe を CropAdjuster フォルダに同梱
        run: |
          Copy-Item dist\make_poster.exe dist\CropAdjuster\make_poster.exe

      - name: フォルダを zip にまとめる
        run: |
          Compress-Archive -Path dist\CropAdjuster -DestinationPath クロップ調整ツール-Win.zip

      - name: アーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: クロップ調整ツール-Win.zip

  # ══════════════════════════════════════════
  #  両方完成したら GitHub Release を作成
  # ══════════════════════════════════════════
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # リリース作成に必要
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: GitHub Release を作成してファイルを添付
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "安定版 ビルド #${{ github.run_number }}" \
            --notes "stable ブランチから自動ビルドされました。

          ## ダウンロード方法
          - **Mac用**: クロップ調整ツール-Mac.zip を解凍 → CropAdjuster.app をダブルクリック
          - **Win用**: クロップ調整ツール-Win.zip を解凍 → CropAdjuster.exe をダブルクリック

          ビルド番号: #${{ github.run_number }}
          コミット: ${{ github.sha }}" \
            "artifacts/mac-build/クロップ調整ツール-Mac.zip" \
            "artifacts/win-build/クロップ調整ツール-Win.zip"
